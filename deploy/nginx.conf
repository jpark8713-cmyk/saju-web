# nginx 설정 예시 (D-030). /etc/nginx/conf.d/saju.conf 등에 둔다. 도메인·인증서 경로는 바꿔 쓴다.
# IP별 속도 제한의 주 방어선이다. 앱은 X-Real-IP(이 설정이 덮어쓴 값)로 한 번 더 센다(TRUST_PROXY=true).

# IPv6는 앞 64비트로 묶어 센다(주소를 바꿔 가며 제한을 피하지 못하게). 압축 표기(::)가 앞 4칸에 들어간 주소는 주소 전체로 센다.
map $remote_addr $limit_key {
  ~^(?P<p64>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+): $p64;
  default $binary_remote_addr;
}

limit_req_zone $limit_key zone=saju_api:10m rate=10r/s;
limit_req_zone $limit_key zone=saju_refund:10m rate=6r/m;
limit_req_status 429;

server {
  listen 443 ssl;
  http2 on;
  server_name example.com;
  ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

  # 이 서비스의 요청 본문은 모두 수 KB다(앱도 64KB를 넘으면 읽지 않는다)
  client_max_body_size 64k;

  location ~ ^/api/orders/[^/]+/refund-request$ {
    limit_req zone=saju_refund burst=5 nodelay;
    include /etc/nginx/saju-proxy.conf;
  }

  location /api/ {
    limit_req zone=saju_api burst=20 nodelay;
    include /etc/nginx/saju-proxy.conf;
  }

  location / {
    include /etc/nginx/saju-proxy.conf;
  }
}

server {
  listen 80;
  server_name example.com;
  return 301 https://$host$request_uri;
}

