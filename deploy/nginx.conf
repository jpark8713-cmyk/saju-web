# nginx 설정 예시 (D-030). /etc/nginx/conf.d/saju.conf 등에 둔다. 도메인·인증서 경로는 바꿔 쓴다.
# IP별 속도 제한의 주 방어선이다. 앱은 X-Real-IP(이 설정이 덮어쓴 값)로 한 번 더 센다(TRUST_PROXY=true).

# IPv6는 앞 64비트(/64)로 묶어 센다(주소를 바꿔 가며 제한을 피하지 못하게, D-031).
# nginx의 $remote_addr는 0이 2칸 이상 이어진 가장 긴 구간을 ::로 줄여 쓴다. 앞 4칸 안에 ::가 들어간 주소는
# :: 앞뒤 칸 수로 줄어든 0의 개수를 알 수 있으므로, 경우마다 규칙을 두어 앞 4칸을 그대로 되살린다(예: 2001:db8:abcd::5 → 2001:db8:abcd:0).
# 규칙은 위에서부터 처음 맞는 것이 쓰인다. 정규식에 { }가 들어 있어 모두 큰따옴표로 감싼다(감싸지 않으면 nginx가 설정을 읽지 못한다).
# 이 규칙은 tests/web/nginxMap.test.ts가 검사한다.
map $remote_addr $limit_key {
  "~^::ffff:(?P<v4>[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)$" $v4;
  "~^(?P<a1>[0-9a-f]{1,4}):(?P<a2>[0-9a-f]{1,4}):(?P<a3>[0-9a-f]{1,4}):(?P<a4>[0-9a-f]{1,4}):" $a1:$a2:$a3:$a4;
  "~^::$" 0:0:0:0;
  "~^::(?P<r1>[0-9a-f]{1,4})$" 0:0:0:0;
  "~^::(?P<r1>[0-9a-f]{1,4}):(?P<r2>[0-9a-f]{1,4})$" 0:0:0:0;
  "~^::(?P<r1>[0-9a-f]{1,4}):(?P<r2>[0-9a-f]{1,4}):(?P<r3>[0-9a-f]{1,4})$" 0:0:0:0;
  "~^::(?P<r1>[0-9a-f]{1,4}):(?P<r2>[0-9a-f]{1,4}):(?P<r3>[0-9a-f]{1,4}):(?P<r4>[0-9a-f]{1,4})$" 0:0:0:0;
  "~^::(?P<r1>[0-9a-f]{1,4}):(?P<r2>[0-9a-f]{1,4}):(?P<r3>[0-9a-f]{1,4}):(?P<r4>[0-9a-f]{1,4}):(?P<r5>[0-9a-f]{1,4})$" 0:0:0:$r1;
  "~^::(?P<r1>[0-9a-f]{1,4}):(?P<r2>[0-9a-f]{1,4}):(?P<r3>[0-9a-f]{1,4}):(?P<r4>[0-9a-f]{1,4}):(?P<r5>[0-9a-f]{1,4}):(?P<r6>[0-9a-f]{1,4})$" 0:0:$r1:$r2;
  "~^(?P<l1>[0-9a-f]{1,4})::$" $l1:0:0:0;
  "~^(?P<l1>[0-9a-f]{1,4})::(?P<r1>[0-9a-f]{1,4})$" $l1:0:0:0;
  "~^(?P<l1>[0-9a-f]{1,4})::(?P<r1>[0-9a-f]{1,4}):(?P<r2>[0-9a-f]{1,4})$" $l1:0:0:0;
  "~^(?P<l1>[0-9a-f]{1,4})::(?P<r1>[0-9a-f]{1,4}):(?P<r2>[0-9a-f]{1,4}):(?P<r3>[0-9a-f]{1,4})$" $l1:0:0:0;
  "~^(?P<l1>[0-9a-f]{1,4})::(?P<r1>[0-9a-f]{1,4}):(?P<r2>[0-9a-f]{1,4}):(?P<r3>[0-9a-f]{1,4}):(?P<r4>[0-9a-f]{1,4})$" $l1:0:0:0;
  "~^(?P<l1>[0-9a-f]{1,4})::(?P<r1>[0-9a-f]{1,4}):(?P<r2>[0-9a-f]{1,4}):(?P<r3>[0-9a-f]{1,4}):(?P<r4>[0-9a-f]{1,4}):(?P<r5>[0-9a-f]{1,4})$" $l1:0:0:$r1;
  "~^(?P<l1>[0-9a-f]{1,4}):(?P<l2>[0-9a-f]{1,4})::$" $l1:$l2:0:0;
  "~^(?P<l1>[0-9a-f]{1,4}):(?P<l2>[0-9a-f]{1,4})::(?P<r1>[0-9a-f]{1,4})$" $l1:$l2:0:0;
  "~^(?P<l1>[0-9a-f]{1,4}):(?P<l2>[0-9a-f]{1,4})::(?P<r1>[0-9a-f]{1,4}):(?P<r2>[0-9a-f]{1,4})$" $l1:$l2:0:0;
  "~^(?P<l1>[0-9a-f]{1,4}):(?P<l2>[0-9a-f]{1,4})::(?P<r1>[0-9a-f]{1,4}):(?P<r2>[0-9a-f]{1,4}):(?P<r3>[0-9a-f]{1,4})$" $l1:$l2:0:0;
  "~^(?P<l1>[0-9a-f]{1,4}):(?P<l2>[0-9a-f]{1,4})::(?P<r1>[0-9a-f]{1,4}):(?P<r2>[0-9a-f]{1,4}):(?P<r3>[0-9a-f]{1,4}):(?P<r4>[0-9a-f]{1,4})$" $l1:$l2:0:0;
  "~^(?P<l1>[0-9a-f]{1,4}):(?P<l2>[0-9a-f]{1,4}):(?P<l3>[0-9a-f]{1,4})::$" $l1:$l2:$l3:0;
  "~^(?P<l1>[0-9a-f]{1,4}):(?P<l2>[0-9a-f]{1,4}):(?P<l3>[0-9a-f]{1,4})::(?P<r1>[0-9a-f]{1,4})$" $l1:$l2:$l3:0;
  "~^(?P<l1>[0-9a-f]{1,4}):(?P<l2>[0-9a-f]{1,4}):(?P<l3>[0-9a-f]{1,4})::(?P<r1>[0-9a-f]{1,4}):(?P<r2>[0-9a-f]{1,4})$" $l1:$l2:$l3:0;
  "~^(?P<l1>[0-9a-f]{1,4}):(?P<l2>[0-9a-f]{1,4}):(?P<l3>[0-9a-f]{1,4})::(?P<r1>[0-9a-f]{1,4}):(?P<r2>[0-9a-f]{1,4}):(?P<r3>[0-9a-f]{1,4})$" $l1:$l2:$l3:0;
  default $binary_remote_addr;
}

limit_req_zone $limit_key zone=saju_api:10m rate=10r/s;
limit_req_zone $limit_key zone=saju_refund:10m rate=6r/m;
limit_req_status 429;

server {
  listen 443 ssl;
  http2 on;
  server_name example.com;
  ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

  # 이 서비스의 요청 본문은 모두 수 KB다(앱도 64KB를 넘으면 읽지 않는다)
  client_max_body_size 64k;

  location ~ ^/api/orders/[^/]+/refund-request$ {
    limit_req zone=saju_refund burst=5 nodelay;
    include /etc/nginx/saju-proxy.conf;
  }

  location /api/ {
    limit_req zone=saju_api burst=20 nodelay;
    include /etc/nginx/saju-proxy.conf;
  }

  location / {
    include /etc/nginx/saju-proxy.conf;
  }
}

server {
  listen 80;
  server_name example.com;
  return 301 https://$host$request_uri;
}

